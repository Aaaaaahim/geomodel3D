name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: Python ${{ matrix.python }} on Windows
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.10", "3.11"]
    env:
      QT_QPA_PLATFORM: offscreen
      GEOMODEL3D_NO_VTK: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Compile
        run: python -m compileall -q geomodel3d tests

      - name: Tests
        run: python -m pytest -q

      - name: Benchmark (200k cells)
        if: matrix.python == '3.11'
        run: python -m geomodel3d.algorithms.benchmark --resolution 100 100 20

  package:
    name: Build & smoke frozen EXE
    runs-on: windows-latest
    env:
      QT_QPA_PLATFORM: offscreen
      GEOMODEL3D_NO_VTK: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]" pyinstaller

      - name: Build EXE
        run: python -m PyInstaller --clean --noconfirm --log-level ERROR --distpath dist --workpath build packaging\geomodel3d.spec

      - name: Frozen self-test (assembly + model + reserve + section + CRS/SHP/XLSX/VTU)
        run: |
          $env:GEOMODEL3D_SELF_TEST="1"
          $exe = "dist\GeoModel3D\GeoModel3D.exe"
          $p = Start-Process -FilePath $exe -PassThru
          if (-not $p.WaitForExit(180000)) { Stop-Process -Id $p.Id -Force; throw "self-test timeout" }
          if ($p.ExitCode -ne 0) { throw "self-test exit=$($p.ExitCode)" }
